name: Refresh bundled data

# Weekly pull of the reference data files into the repo, so the app's bundled
# fallbacks stay current and clients fetch them from GitHub's CDN rather than
# hammering the upstream servers.
#
# Optional repo variables (Settings → Secrets and variables → Actions → Variables)
# — only needed to override the built-in canonical source URLs:
#   PRESETS_SOURCE_URL  – defaults to https://dxcluster.info/telnet/DXCLUSTERS.DAT
#   CTY_SOURCE_URL      – defaults to https://www.country-files.com/cty/cty.dat

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download cluster node list
        run: |
          set -euo pipefail
          url="${{ vars.PRESETS_SOURCE_URL || 'https://dxcluster.info/telnet/DXCLUSTERS.DAT' }}"
          curl -fsSL --retry 3 --max-time 60 "$url" -o /tmp/dxclusters.dat
          nodes=$(grep -c '^"[^"]*","[^"]*","[0-9]' /tmp/dxclusters.dat || true)
          echo "parsed $nodes node lines"
          test "$nodes" -ge 100
          grep -q '^"VERSION"' /tmp/dxclusters.dat
          mv /tmp/dxclusters.dat src-tauri/resources/dxclusters.dat

      - name: Download cty.dat
        run: |
          set -euo pipefail
          url="${{ vars.CTY_SOURCE_URL || 'https://www.country-files.com/cty/cty.dat' }}"
          curl -fsSL --retry 3 --max-time 60 "$url" -o /tmp/cty.dat
          # A plausible country file has hundreds of entity header lines.
          ents=$(grep -c ': *[0-9]\+: *[0-9]\+: *[A-Z][A-Z]:' /tmp/cty.dat || true)
          echo "parsed $ents entity lines"
          test "$ents" -ge 200
          mv /tmp/cty.dat src-tauri/resources/cty.dat

      - name: Refresh RBN skimmer positions
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 60 \
            "https://www.reversebeacon.net/cont_includes/status.php?t=skt" -o /tmp/skt.html
          python3 - <<'PY'
          import re, sys
          path = "src-tauri/resources/rbn_skimmers.tsv"
          html = open("/tmp/skt.html", encoding="utf-8", errors="replace").read()
          call_re = re.compile(r"[?&]c=([A-Za-z0-9]+(?:-\d+)?)&t=de", re.I)
          grid_re = re.compile(r"<td>\s*([A-R]{2}\d{2}(?:[A-X]{2})?)\s*</td>", re.I)
          seen = {}
          for row in html.split("<tr"):  # split first so a grid-less row can't borrow the next grid
              c, g = call_re.search(row), grid_re.search(row)
              if c and g:
                  seen.setdefault(c.group(1).split("-")[0].upper(), g.group(1).upper())
          if len(seen) < 100:
              sys.exit(f"scraped page looks wrong ({len(seen)} skimmers)")
          # Merge into the committed table — the page only lists currently-active
          # skimmers, so a plain rewrite keeps dropping ones that are off air.
          table = {}
          try:
              with open(path, encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      parts = line.split("\t")
                      if len(parts) >= 2 and parts[0]:
                          table[parts[0].split("-")[0].upper()] = parts[1].strip().upper()
          except FileNotFoundError:
              pass
          added = sum(1 for k in seen if k not in table)
          table.update(seen)  # fresh grid wins
          with open(path, "w", encoding="utf-8") as f:
              f.write("# RBN skimmer positions — CALL<TAB>grid. Accumulated across weekly scrapes of\n")
              f.write("# reversebeacon.net/cont_includes/status.php?t=skt (fresh grid wins on conflict).\n")
              for call in sorted(table):
                  f.write(f"{call}\t{table[call]}\n")
          print(f"wrote {len(table)} skimmer positions ({added} new, {len(seen)} scraped)")
          PY

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- src-tauri/resources/; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh bundled data [skip ci]" -- src-tauri/resources/
          git push

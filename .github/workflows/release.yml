name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # Linux — .AppImage / .deb / .rpm
            args: ""
          - platform: windows-latest # Windows — .msi / .exe (NSIS)
            args: ""
          # Both macOS builds run on Apple-Silicon runners (plentiful; the Intel
          # `macos-13` queue is unreliable and being retired). The Intel slice is
          # a cross-compile to x86_64-apple-darwin.
          - platform: macos-14 # macOS Apple Silicon — .dmg
            args: "--target aarch64-apple-darwin"
          - platform: macos-14 # macOS Intel — .dmg (cross-compiled)
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK + packaging tools. Everything the app itself links is either
      # bundled by the Tauri bundler (AppImage) or declared as a package
      # dependency (.deb / .rpm) — nothing extra for the end user to install,
      # except `rigctld` for optional CAT control (documented in the README).
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DX Cluster Desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            Desktop DX cluster client for Windows, macOS and Linux.

            **Install**
            - Windows: `.msi` or `.exe`
            - macOS: `.dmg` (Apple Silicon or Intel) — unsigned build, first launch: right-click → Open
            - Linux: `.AppImage` (portable), `.deb` or `.rpm`

            Every build is self-contained. The only optional external component
            is **`rigctld`** (from Hamlib) for CAT rig control — it is **not**
            bundled; install it separately if you want rig control.

            See the [user manual](https://github.com/dacrhu/dx-cluster-desktop/blob/main/user-manual/README.md)
            and the [changelog](https://github.com/dacrhu/dx-cluster-desktop/commits/${{ github.ref_name }}).
